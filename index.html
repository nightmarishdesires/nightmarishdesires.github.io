<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>michael ghan</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0b0b0b;
    color: #fff;
    display: flex;
    min-height: 100vh;
    font-family: "Playfair Display", serif;
  }

  /* SIDEBAR */
  .sidebar {
    width: 240px;
    padding: 50px 30px;
    position: fixed;
    height: 100vh;
    border-right: 1px solid rgba(255,255,255,0.08);
  }

  .name {
    font-size: 22px;
    letter-spacing: 1px;
    margin-bottom: 60px;
    text-transform: lowercase;
  }

  .menu a {
    display: block;
    color: #aaa;
    text-decoration: none;
    margin-bottom: 18px;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: lowercase;
    cursor: pointer;
    transition: 0.2s;
  }

  .menu a:hover {
    color: #fff;
  }

  /* CONTENT (UNCHANGED LAYOUT) */
  .content {
    margin-left: 240px;
    padding: 70px;
    width: 100%;
  }

  section {
    display: none;
  }

  section.active {
    display: block;
  }

  h2 {
    font-size: 20px;
    margin-bottom: 25px;
    font-weight: 400;
    text-transform: lowercase;
    letter-spacing: 1px;
  }

  p {
    color: #aaa;
    line-height: 1.8;
    max-width: 600px;
    font-size: 14px;
  }

  .email {
    margin-top: 20px;
    color: #777;
    font-size: 13px;
  }

  /* VIDEO (RESTORED ORIGINAL EXACT BEHAVIOR) */
  .video {
    width: 100%;
    aspect-ratio: 16 / 9;
    margin-bottom: 20px;
  }

  .video iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  /* PHOTO GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
  }

  .photo {
    width: 100%;
    height: auto;
    object-fit: cover;
    cursor: pointer;
    transition: 0.3s ease;
  }

  .photo:hover {
    opacity: 0.85;
  }

  /* LIGHTBOX */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    padding: 40px;
  }

  .lightbox img {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
  }

  .lightbox.active {
    display: flex;
  }

  /* LANDING (SIMPLIFIED PER REQUEST) */
  #landing {
    position: fixed;
    inset: 0;
    z-index: 10000;
    background: black;
    overflow: hidden;
  }

  #landing video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: contrast(1.05) brightness(0.9);
  }

  #enter-btn {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 14px;
    letter-spacing: 3px;
    text-transform: lowercase;
    color: white;

    cursor: pointer;
  }

  .hidden-site {
    display: none;
  }

  #landing.fade-out {
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  @media (max-width: 768px) {
    body {
      flex-direction: column;
    }

    .sidebar {
      position: relative;
      width: 100%;
      height: auto;
      border-right: none;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .content {
      margin-left: 0;
      padding: 30px;
    }
  }
</style>
</head>

<body>

<!-- LANDING -->
<div id="landing">

  <video autoplay muted loop playsinline>
    <source src="./landing.mp4" type="video/mp4">
  </video>

  <div id="enter-btn">enter</div>

</div>

<!-- SITE -->
<div id="site-content" class="hidden-site">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="name">michael ghan</div>

  <div class="menu">
    <a onclick="showSection('video')">video</a>
    <a onclick="showSection('photo')">photo</a>
    <a onclick="showSection('books')">books</a>
    <a onclick="showSection('sound')">sound</a>
    <a onclick="showSection('bio')">bio</a>
  </div>
</div>

<!-- CONTENT -->
<div class="content">

  <!-- VIDEO (UNCHANGED STRUCTURE) -->
  <section id="video" class="active">
    <h2>video</h2>

    <div class="video">
      <iframe src="https://player.vimeo.com/video/839530277?title=0&byline=0&portrait=0"
        allowfullscreen></iframe>
    </div>

    <div class="video">
      <iframe src="https://player.vimeo.com/video/1200260766"
        allowfullscreen></iframe>
    </div>

    <div class="video">
      <iframe src="https://www.youtube.com/embed/wBJBsNOXics"
        allowfullscreen></iframe>
    </div>

  </section>

  <!-- PHOTO -->
  <section id="photo">
    <h2>photo</h2>
    <div class="grid">
      <img class="photo" src="img001.jpg"/>
      <img class="photo" src="img003.jpg"/>
      <img class="photo" src="img005.jpg"/>
      <img class="photo" src="img020.jpg"/>
      <img class="photo" src="img021.jpg"/>
      <img class="photo" src="img067.jpg"/>
    </div>
  </section>

  <!-- BOOKS -->
  <section id="books">
    <h2>books</h2>
    <p style="margin-bottom: 30px;">nightmarish desires vol 1</p>

    <div class="grid">
      <img class="photo" src="book1.JPG"/>
      <img class="photo" src="book2.JPG"/>
      <img class="photo" src="book3.JPG"/>
      <img class="photo" src="book4.JPG"/>
      <img class="photo" src="book5.JPG"/>
      <img class="photo" src="book6.JPG"/>
      <img class="photo" src="book7.JPG"/>
    </div>
  </section>

  <!-- SOUND -->
  <section id="sound">
    <h2>sound</h2>
    <p>coming soon</p>
  </section>

  <!-- BIO -->
  <section id="bio">
    <h2>bio</h2>
    <p>filmmaker + photographer living in los angeles</p>
    <div class="email">nightmarish.desires@gmail.com</div>
  </section>

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <img id="lightbox-img" src="">
</div>

</div>

<script>
  function showSection(id) {
    const sections = document.querySelectorAll("section");
    sections.forEach(sec => sec.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  document.querySelectorAll(".photo").forEach(photo => {
    photo.addEventListener("click", () => {
      document.getElementById("lightbox").classList.add("active");
      document.getElementById("lightbox-img").src = photo.src;
    });
  });

  document.getElementById("lightbox").addEventListener("click", () => {
    document.getElementById("lightbox").classList.remove("active");
  });

  document.getElementById("enter-btn").addEventListener("click", () => {
    const landing = document.getElementById("landing");
    const site = document.getElementById("site-content");

    landing.classList.add("fade-out");

    setTimeout(() => {
      landing.style.display = "none";
      site.classList.remove("hidden-site");
    }, 800);
  });
</script>

</body>
</html>
